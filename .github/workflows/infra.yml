name: Infrastructure CI/CD

on:
  push:
    branches:
      - main
    paths:
      - "terraform/**"
      - "ansible/**"
      - ".github/workflows/infra.yml"

  workflow_dispatch:
    inputs:
      rebuild_cluster:
        description: Force Terraform apply path
        type: boolean
        required: false
        default: false

permissions:
  contents: read

env:
  TF_ROOT: terraform
  ANSIBLE_ROOT: ansible

  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"

  AWS_REGION: ${{ vars.AWS_REGION }}
  AWS_DEFAULT_REGION: ${{ vars.AWS_REGION }}

  ANSIBLE_SSM_BUCKET: ${{ vars.ANSIBLE_SSM_BUCKET }}

  TF_VAR_admin_cidr: ${{ vars.TF_VAR_ADMIN_CIDR }}
  TF_VAR_ssh_public_key: ${{ vars.TF_VAR_SSH_PUBLIC_KEY }}

jobs:
  changes:
    runs-on: ubuntu-latest

    outputs:
      terraform: ${{ steps.detect.outputs.terraform }}
      ansible: ${{ steps.detect.outputs.ansible }}

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - id: detect
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "terraform=true" >> "$GITHUB_OUTPUT"
            echo "ansible=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          FILES=$(git diff \
            --name-only \
            "${{ github.event.before }}" \
            "${GITHUB_SHA}")

          echo "$FILES"

          if echo "$FILES" | grep -q '^terraform/'; then
            echo "terraform=true" >> "$GITHUB_OUTPUT"
          else
            echo "terraform=false" >> "$GITHUB_OUTPUT"
          fi

          if echo "$FILES" | grep -q '^ansible/'; then
            echo "ansible=true" >> "$GITHUB_OUTPUT"
          else
            echo "ansible=false" >> "$GITHUB_OUTPUT"
          fi


  validate:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.13"
          terraform_wrapper: false

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Terraform validation
        run: |
          terraform -chdir="$TF_ROOT" fmt -check -recursive
          terraform -chdir="$TF_ROOT" init -backend=false
          terraform -chdir="$TF_ROOT" validate

      - name: Install Ansible
        run: |
          pip install ansible boto3 botocore
          ansible-galaxy collection install \
            -r "$ANSIBLE_ROOT/requirements.yml"

      - name: Ansible syntax validation
        run: |
          cat > /tmp/inventory.ini <<EOF
          [control_plane]
          control-plane ansible_host=127.0.0.1

          [workers]
          worker-1 ansible_host=127.0.0.1
          worker-2 ansible_host=127.0.0.1

          [k8s_nodes:children]
          control_plane
          workers
          EOF

          ansible-playbook \
            -i /tmp/inventory.ini \
            --syntax-check \
            "$ANSIBLE_ROOT/playbooks/site.yml"


  plan:
    runs-on: ubuntu-latest

    needs:
      - changes
      - validate

    if: |
      needs.changes.outputs.terraform == 'true' ||
      inputs.rebuild_cluster == true

    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v7

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.13"
          terraform_wrapper: false

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          role-session-name: GitHubTerraformPlan-${{ github.run_id }}
          aws-region: ${{ vars.AWS_REGION }}

      - run: aws sts get-caller-identity

      - name: Terraform plan
        run: |
          terraform -chdir="$TF_ROOT" init

          terraform -chdir="$TF_ROOT" \
            plan \
            -out=tfplan

          terraform -chdir="$TF_ROOT" \
            show \
            -no-color \
            tfplan \
            > "$TF_ROOT/plan.txt"

          cat "$TF_ROOT/plan.txt"
      
      - name: Upload Terraform plan
        uses: actions/upload-artifact@v7
        with:
          name: terraform-plan
          path: |
            terraform/tfplan
            terraform/plan.txt
          retention-days: 1


  apply:
    runs-on: ubuntu-latest

    needs:
      - changes
      - plan

    if: |
      needs.changes.outputs.terraform == 'true' ||
      inputs.rebuild_cluster == true

    environment: infrastructure

    concurrency:
      group: anime-review-infra
      cancel-in-progress: false

    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v7

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.13"
          terraform_wrapper: false

      - uses: actions/download-artifact@v7
        with:
          name: terraform-plan
          path: terraform

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          role-session-name: GitHubTerraformApply-${{ github.run_id }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Terraform apply
        run: |
          terraform -chdir="$TF_ROOT" init

          terraform -chdir="$TF_ROOT" \
            apply \
            -auto-approve \
            tfplan


  configure:
    runs-on: ubuntu-latest

    needs:
      - changes
      - validate
      - apply

    if: |
      always() &&
      needs.validate.result == 'success' &&
      (
        needs.apply.result == 'success' ||
        (
          needs.changes.outputs.terraform != 'true' &&
          needs.changes.outputs.ansible == 'true'
        )
      )

    concurrency:
      group: anime-review-infra
      cancel-in-progress: false

    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v7

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.13"
          terraform_wrapper: false

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          role-session-name: GitHubAnsible-${{ github.run_id }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Install Ansible and SSM plugin
        run: |
          pip install ansible boto3 botocore

          ansible-galaxy collection install \
            -r "$ANSIBLE_ROOT/requirements.yml"

          curl \
            "https://s3.amazonaws.com/session-manager-downloads/plugin/latest/ubuntu_64bit/session-manager-plugin.deb" \
            -o /tmp/session-manager-plugin.deb

          sudo dpkg -i /tmp/session-manager-plugin.deb

          session-manager-plugin --version

      - name: Generate inventory
        run: |
          terraform -chdir="$TF_ROOT" init

          bash \
            "$ANSIBLE_ROOT/scripts/generate_inventory.sh"

      - name: Wait for SSM
        run: |
          for attempt in $(seq 1 60); do

            ONLINE_COUNT=$(aws ssm describe-instance-information \
              --query 'length(InstanceInformationList[?PingStatus==`Online`])' \
              --output text)

            echo "SSM nodes online: ${ONLINE_COUNT}/3"

            if [[ "$ONLINE_COUNT" -ge 3 ]]; then
              break
            fi

            if [[ "$attempt" -eq 60 ]]; then
              echo "Timed out waiting for SSM nodes"
              exit 1
            fi

            sleep 10
          done

      - name: Configure Kubernetes nodes
        run: |
          ansible-playbook \
            -i "$ANSIBLE_ROOT/inventory/inventory.ini" \
            "$ANSIBLE_ROOT/playbooks/site.yml"

      - name: Verify cluster
        run: |
          ansible control_plane \
            -i "$ANSIBLE_ROOT/inventory/inventory.ini" \
            -b \
            -m shell \
            -a '/usr/bin/kubectl --kubeconfig /etc/kubernetes/admin.conf get nodes -o wide'

          ansible control_plane \
            -i "$ANSIBLE_ROOT/inventory/inventory.ini" \
            -b \
            -m shell \
            -a '/usr/bin/kubectl --kubeconfig /etc/kubernetes/admin.conf get pods -n kube-system'

          ansible control_plane \
            -i "$ANSIBLE_ROOT/inventory/inventory.ini" \
            -b \
            -m shell \
            -a '/usr/bin/kubectl --kubeconfig /etc/kubernetes/admin.conf get pods -n calico-system'

          ansible control_plane \
            -i "$ANSIBLE_ROOT/inventory/inventory.ini" \
            -b \
            -m shell \
            -a '/usr/local/bin/helm version'

          ansible control_plane \
            -i "$ANSIBLE_ROOT/inventory/inventory.ini" \
            -b \
            -m shell \
            -a '/usr/bin/kubectl --kubeconfig /etc/kubernetes/admin.conf wait --for=condition=Ready nodes --all --timeout=120s'


  bootstrap-k8s:
    runs-on: ubuntu-latest

    needs:
      - configure

    env:
      K8S_WORKFLOW_TOKEN: ${{ secrets.K8S_WORKFLOW_TOKEN }}

    permissions: {}

    steps:
      - name: Trigger Kubernetes bootstrap
        run: |
          set -euo pipefail

          PAYLOAD=$(jq -n \
            '{
              ref: "main",
              inputs: {
                image_tag: "",
                backend_repository: "",
                frontend_repository: "",
                bootstrap_cluster: "true"
              }
            }')

          RESPONSE=$(curl \
            --fail-with-body \
            --silent \
            --show-error \
            -L \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${K8S_WORKFLOW_TOKEN}" \
            -H "X-GitHub-Api-Version: 2026-03-10" \
            https://api.github.com/repos/Songhai9/anime-review-k8s/actions/workflows/deploy.yml/dispatches \
            -d "$PAYLOAD")

          RUN_ID=$(echo "$RESPONSE" | jq -r '.workflow_run_id // empty')

          [[ -n "$RUN_ID" ]] || exit 1

          while true; do

            RUN=$(curl \
              --fail-with-body \
              --silent \
              --show-error \
              -L \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer ${K8S_WORKFLOW_TOKEN}" \
              -H "X-GitHub-Api-Version: 2026-03-10" \
              "https://api.github.com/repos/Songhai9/anime-review-k8s/actions/runs/${RUN_ID}")

            STATUS=$(echo "$RUN" | jq -r '.status')
            CONCLUSION=$(echo "$RUN" | jq -r '.conclusion // empty')

            echo "K8s bootstrap: $STATUS ${CONCLUSION}"

            if [[ "$STATUS" == "completed" ]]; then
              [[ "$CONCLUSION" == "success" ]] || exit 1
              break
            fi

            sleep 10
          done