  - name: Configure backend
    hosts: backend
    become: true
    tasks:
    - name: Download NodeSource GPG key
      ansible.builtin.get_url:
        url: https://deb.nodesource.com/gpgkey/nodesource-repo.gpg.key
        dest: /usr/share/keyrings/nodesource.asc
        mode: "0644"

    - name: Add NodeSource repository
      ansible.builtin.deb822_repository:
        name: NodeSource
        types:
          - deb
        uris:
          - https://deb.nodesource.com/node_26.x
        suites:
          - nodistro
        components:
          - main
        signed_by: /usr/share/keyrings/nodesource.asc
        state: present

    - name: Install node.js
      ansible.builtin.apt:
        name: 
        - nodejs
        - git
        state: present
        update_cache: true
    
    - name: Check Node.js version
      ansible.builtin.command: node --version
      register: node_version
      changed_when: false
    - name: Check npm version
      ansible.builtin.command: npm --version
      register: npm_version
      changed_when: false

    - name: Display Node.js and npm versions
      ansible.builtin.debug:
        msg:
        - "Node.js: {{ node_version.stdout }}"
        - "npm: {{ npm_version.stdout }}"
    
    - name: Clone repo
      ansible.builtin.git:
        repo: "https://gitlab.com/Songhai9/manga-app.git"
        dest: /opt/anime-review
        version: main

    - name: Install dependencies
      ansible.builtin.command: npm ci
      args:
        chdir: /opt/anime-review
