- name: Install node.js and npm
  hosts: backend
  become: true
  tasks:
  - name: Download NodeSource GPG key
    ansible.builtin.get_url:
      url: https://deb.nodesource.com/gpgkey/nodesource-repo.gpg.key
      dest: /usr/share/keyrings/nodesource.asc
      mode: "0644"

  - name: Add NodeSource repository
    ansible.builtin.deb822_repository:
      name: NodeSource
      types:
        - deb
      uris:
        - https://deb.nodesource.com/node_26.x
      suites:
        - nodistro
      components:
        - main
      signed_by: /usr/share/keyrings/nodesource.asc
      state: present

  - name: Install node.js
    ansible.builtin.apt:
      name: nodejs
      state: present
      update_cache: true
  
  - name: Check Node.js and npm versions
    ansible.builtin.command: node --version && npm --version
    register: node_version
    changed_when: false

  - name: Display Node.js version
    ansible.builtin.debug:
      var: node_version.stdout
