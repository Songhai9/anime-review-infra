- name: Deploy backend container
  hosts: backend
  become: true

  tasks:
    - name: Login to GitLab Container Registry
      community.docker.docker_login:
        registry_url: "{{ registry_url }}"
        username: "{{ registry_username }}"
        password: "{{ registry_password }}"
        reauthorize: true
      no_log: true

    - name: Run backend container
      community.docker.docker_container:
        name: "{{ backend_container_name }}"
        image: "{{ backend_image }}"
        state: started
        pull: always
        restart_policy: unless-stopped

        ports:
          - "{{ backend_port }}:{{ backend_port }}"

        env:
          API_PORT: "{{ backend_port }}"

          DATABASE_HOST: "{{ database_private_ip }}"
          DATABASE_PORT: "{{ db_port }}"
          DATABASE_NAME: "{{ db_name }}"
          DATABASE_USER: "{{ db_user }}"
          DATABASE_PASSWORD: "{{ db_password }}"

          DATABASE_SSL: "false"
          DATABASE_SEED: "false"

      no_log: true

    - name: Wait for backend health endpoint
      ansible.builtin.uri:
        url: "http://localhost:{{ backend_port }}/health"
        method: GET
        status_code: 200
      register: backend_health
      retries: 10
      delay: 3
      until: backend_health.status == 200

    - name: Wait for backend readiness endpoint
      ansible.builtin.uri:
        url: "http://localhost:{{ backend_port }}/ready"
        method: GET
        status_code: 200
      register: backend_ready
      retries: 10
      delay: 3
      until: backend_ready.status == 200
