- name: Configure backend
  hosts: backend
  become: true
  tasks:
    - name: Download NodeSource GPG key
      ansible.builtin.get_url:
        url: https://deb.nodesource.com/gpgkey/nodesource-repo.gpg.key
        dest: /usr/share/keyrings/nodesource.asc
        mode: "0644"

    - name: Add NodeSource repository
      ansible.builtin.deb822_repository:
        name: NodeSource
        types:
          - deb
        uris:
          - https://deb.nodesource.com/node_26.x
        suites:
          - nodistro
        components:
          - main
        signed_by: /usr/share/keyrings/nodesource.asc
        state: present

    - name: Install node.js
      ansible.builtin.apt:
        name:
          - nodejs
          - git
        state: present
        update_cache: true

    - name: Check Node.js version
      ansible.builtin.command: node --version
      register: node_version
      changed_when: false
    - name: Check npm version
      ansible.builtin.command: npm --version
      register: npm_version
      changed_when: false

    - name: Display Node.js and npm versions
      ansible.builtin.debug:
        msg:
          - "Node.js: {{ node_version.stdout }}"
          - "npm: {{ npm_version.stdout }}"

    - name: Clone repo
      ansible.builtin.git:
        repo: "https://gitlab.com/Songhai9/manga-app.git"
        dest: /opt/anime-review
        version: main

    - name: Install dependencies
      ansible.builtin.command: npm ci
      args:
        chdir: /opt/anime-review

    - name: Add the user 'johnd' with a specific uid and a primary group of 'admin'
      ansible.builtin.user:
        name: api_launcher
        shell: /bin/bash

    - name: Create backend environment file
      ansible.builtin.copy:
        dest: /etc/anime-review/backend.env
        mode: "0600"
        content: |
          DATABASE_HOST={{ database_private_ip }}
          DATABASE_PORT=5432
          DATABASE_NAME={{ db_name }}
          DATABASE_USER={{ db_user }}
          DATABASE_PASSWORD={{ db_password }}
          DATABASE_SSL=false
          API_PORT=3001
    
    - name: Create backend service
      ansible.builtin.file:
        dest: /etc/systemd/system/anime-review-api.service
        mode: "0600"
        content: |
          [Unit]
          Description=Anime Review API
          After=network.target

          [Service]
          Type=simple
          User=api_launcher
          WorkingDirectory=/opt/anime-review
          EnvironmentFile=/etc/anime-review/backend.env
          ExecStart=/usr/bin/node /opt/anime-review/api/server.js
          Restart=on-failure

          [Install]
          WantedBy=multi-user.target

    - name: Launch backend
      ansible.builtin.systemd_service:
        name: anime-review-api
        state: started
        enabled: true
        daemon_reload: true