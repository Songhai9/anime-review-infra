- name: Prepare Kubernetes nodes
  hosts: k8s_nodes
  become: true
  gather_facts: true

  vars:
    kubernetes_minor_version: "v1.37"
    kubernetes_apt_key_url: >-
      https://pkgs.k8s.io/core:/stable:/{{ kubernetes_minor_version }}/deb/Release.key
    kubernetes_apt_repository: >-
      deb [signed-by=/etc/apt/keyrings/kubernetes-apt-keyring.asc]
      https://pkgs.k8s.io/core:/stable:/{{ kubernetes_minor_version }}/deb/ /

  tasks:

    - name: Disable swap immediately
      ansible.builtin.command:
        cmd: swapoff -a
      when: ansible_swaptotal_mb | int > 0
      changed_when: true

    - name: Disable swap permanently
      ansible.builtin.replace:
        path: /etc/fstab
        regexp: '^([^#].*\sswap\s+.*)$'
        replace: '# \1'


    - name: Persist required kernel modules
      ansible.builtin.copy:
        dest: /etc/modules-load.d/k8s.conf
        mode: "0644"
        content: |
          overlay
          br_netfilter

    - name: Load required kernel modules
      community.general.modprobe:
        name: "{{ item }}"
        state: present
      loop:
        - overlay
        - br_netfilter


    - name: Configure Kubernetes network settings
      ansible.builtin.copy:
        dest: /etc/sysctl.d/k8s.conf
        mode: "0644"
        content: |
          net.bridge.bridge-nf-call-iptables = 1
          net.bridge.bridge-nf-call-ip6tables = 1
          net.ipv4.ip_forward = 1
      notify: Apply sysctl settings


    - name: Install containerd
      ansible.builtin.apt:
        name: containerd
        state: present
        update_cache: true
        cache_valid_time: 3600

    - name: Ensure containerd configuration directory exists
      ansible.builtin.file:
        path: /etc/containerd
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Generate default containerd configuration
      ansible.builtin.command:
        cmd: containerd config default
      register: containerd_default_config
      changed_when: false

    - name: Build containerd configuration using systemd cgroups
      ansible.builtin.set_fact:
        containerd_config: >-
          {{
            containerd_default_config.stdout
            | regex_replace(
                'SystemdCgroup = false',
                'SystemdCgroup = true'
              )
          }}

    - name: Verify systemd cgroup configuration was generated
      ansible.builtin.assert:
        that:
          - "'SystemdCgroup = true' in containerd_config"
        fail_msg: >-
          Unable to configure containerd with the systemd cgroup driver.

    - name: Write containerd configuration
      ansible.builtin.copy:
        dest: /etc/containerd/config.toml
        owner: root
        group: root
        mode: "0644"
        content: "{{ containerd_config }}"
      notify: Restart containerd

    - name: Enable and start containerd
      ansible.builtin.service:
        name: containerd
        state: started
        enabled: true

    - name: Apply pending containerd handlers
      ansible.builtin.meta: flush_handlers


    - name: Install Kubernetes repository prerequisites
      ansible.builtin.apt:
        name:
          - ca-certificates
          - apt-transport-https
        state: present
        update_cache: true
        cache_valid_time: 3600

    - name: Ensure APT keyring directory exists
      ansible.builtin.file:
        path: /etc/apt/keyrings
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Install Kubernetes repository signing key
      ansible.builtin.get_url:
        url: "{{ kubernetes_apt_key_url }}"
        dest: /etc/apt/keyrings/kubernetes-apt-keyring.asc
        owner: root
        group: root
        mode: "0644"

    - name: Configure Kubernetes APT repository
      ansible.builtin.apt_repository:
        repo: "{{ kubernetes_apt_repository }}"
        filename: kubernetes
        state: present
        update_cache: true

    - name: Install kubelet and kubeadm
      ansible.builtin.apt:
        name:
          - kubelet
          - kubeadm
        state: present
        update_cache: true

    - name: Hold kubelet package
      ansible.builtin.dpkg_selections:
        name: kubelet
        selection: hold

    - name: Hold kubeadm package
      ansible.builtin.dpkg_selections:
        name: kubeadm
        selection: hold

    - name: Enable kubelet
      ansible.builtin.service:
        name: kubelet
        enabled: true

  handlers:
    - name: Apply sysctl settings
      ansible.builtin.command:
        cmd: sysctl --system
      changed_when: true

    - name: Restart containerd
      ansible.builtin.service:
        name: containerd
        state: restarted
