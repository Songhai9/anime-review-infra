---
- name: Initialize Kubernetes control plane
  hosts: control_plane
  become: true
  gather_facts: true

  vars:
    kubernetes_pod_cidr: "192.168.0.0/16"
    kubeconfig_user: ubuntu
    kubeconfig_group: ubuntu
    kubeconfig_path: /home/ubuntu/.kube/config

  tasks:
    - name: Initialize the Kubernetes control plane
      ansible.builtin.command:
        cmd: >-
          kubeadm init
          --apiserver-advertise-address={{ ansible_host }}
          --pod-network-cidr={{ kubernetes_pod_cidr }}
      args:
        creates: /etc/kubernetes/admin.conf

    - name: Create administrator kubeconfig directory
      ansible.builtin.file:
        path: "{{ kubeconfig_path | dirname }}"
        state: directory
        owner: "{{ kubeconfig_user }}"
        group: "{{ kubeconfig_group }}"
        mode: "0755"

    - name: Install administrator kubeconfig
      ansible.builtin.copy:
        src: /etc/kubernetes/admin.conf
        dest: "{{ kubeconfig_path }}"
        remote_src: true
        owner: "{{ kubeconfig_user }}"
        group: "{{ kubeconfig_group }}"
        mode: "0600"
