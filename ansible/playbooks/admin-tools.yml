---
- name: Install Kubernetes admin tools
  hosts: control_plane
  become: true
  gather_facts: true

  vars:
    helm_version: "v4.3.0"
    helm_arch: "arm64"

  tasks:
    - name: Check installed Helm version
      ansible.builtin.command:
        cmd: /usr/local/bin/helm version --template '{{ "{{ .Version }}" }}'
      register: helm_installed
      changed_when: false
      failed_when: false

    - name: Download Helm archive
      ansible.builtin.get_url:
        url: "https://get.helm.sh/helm-{{ helm_version }}-linux-{{ helm_arch }}.tar.gz"
        dest: "/tmp/helm-{{ helm_version }}-linux-{{ helm_arch }}.tar.gz"
        mode: "0644"
        checksum: "sha256:https://get.helm.sh/helm-{{ helm_version }}-linux-{{ helm_arch }}.tar.gz.sha256sum"
      when: helm_installed.stdout != helm_version

    - name: Extract Helm archive
      ansible.builtin.unarchive:
        src: "/tmp/helm-{{ helm_version }}-linux-{{ helm_arch }}.tar.gz"
        dest: "/tmp/"
        remote_src: true
      when: helm_installed.stdout != helm_version

    - name: Install Helm binary
      ansible.builtin.copy:
        src: "/tmp/linux-{{ helm_arch }}/helm"
        dest: "/usr/local/bin/helm"
        owner: root
        group: root
        mode: "0755"
        remote_src: true
      when: helm_installed.stdout != helm_version

    - name: Verify Helm installation
      ansible.builtin.command:
        cmd: /usr/local/bin/helm version --template '{{ "{{ .Version }}" }}'
      register: helm_verify
      changed_when: false

    - name: Assert Helm version
      ansible.builtin.assert:
        that:
          - helm_verify.stdout == helm_version
        fail_msg: "Unexpected Helm version installed: {{ helm_verify.stdout }}"

    - name: Delete Helm archive
      ansible.builtin.file:
        path: "/tmp/helm-{{ helm_version }}-linux-{{ helm_arch }}.tar.gz"
        state: absent

    - name: Delete extracted Helm directory
      ansible.builtin.file:
        path: "/tmp/linux-{{ helm_arch }}"
        state: absent
